# Isolated test profile — an in-memory H2 database, never the shared MySQL dev DB.
# Activate with @ActiveProfiles("test") on a @SpringBootTest/@DataJpaTest class, or
# -Dspring.profiles.active=test on the command line. DataInitializer is disabled
# under this profile (see DataInitializer.java @Profile("!test")).
spring.datasource.url=jdbc:h2:mem:thalahena_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

library.app.jwtSecret=TestOnlySecretKeyForJUnitTests2026NotForProduction!
library.app.jwtExpirationMs=86400000

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=test

upload.path=${java.io.tmpdir}
